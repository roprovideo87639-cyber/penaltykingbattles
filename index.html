<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty King Battles</title>
    <!-- Logo in de browser tab -->
    <link rel="icon" href="logo.png" type="image/x-icon">
    
    <!-- Firebase SDK (Firestore versie voor 1 bestand) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --blue: #0033A0;
            --yellow: #FFD100;
        }
        body {
            background-color: var(--blue);
            color: var(--yellow);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .title-container img {
            height: 60px;
            width: auto;
            border-radius: 5px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        h3 {
            margin: 5px 0 20px 0;
            font-style: italic;
            color: #fff;
        }
        .container {
            background-color: #fff;
            color: var(--blue);
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--blue);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            background-color: var(--blue);
            color: var(--yellow);
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            transition: 0.3s;
        }
        button:hover {
            background-color: #001F60;
        }
        .lists-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .list-box {
            background-color: var(--yellow);
            color: var(--blue);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .list-box h2 {
            border-bottom: 2px solid var(--blue);
            padding-bottom: 10px;
            margin-top: 0;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: rgba(255, 255, 255, 0.6);
            margin: 8px 0;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            display: flex;
            align-items: center;
        }
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: var(--blue);
        }
        .home-header h2 {
            margin: 0;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .hidden {
            display: none !important;
        }
        .toggle-auth {
            text-align: center;
            cursor: pointer;
            color: var(--blue);
            text-decoration: underline;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-container">
            <img src="logo.png" alt="Logo" id="logo" onerror="this.style.display='none'">
            <h1>Penalty King Battles</h1>
        </div>
        <h3>discription: 2026/27 Golden Season</h3>
    </header>

    <!-- INLOGGEN EN REGISTREREN -->
    <div class="container" id="auth-section">
        
        <!-- Inlog Formulier -->
        <div id="login-form">
            <h2>Inloggen</h2>
            <input type="text" id="login-naam" placeholder="Jouw exacte volledige naam" required>
            <div id="login-error" class="error"></div>
            <button onclick="login()">Inloggen</button>
            <p class="toggle-auth" onclick="toggleAuth()">Nog geen account? Registreer hier.</p>
        </div>

        <!-- Registratie Formulier -->
        <div id="register-form" class="hidden">
            <h2>Registreren</h2>
            <input type="text" id="reg-naam" placeholder="Volledige naam (bijv. Jan Smit)" required>
            <div id="reg-naam-error" class="error"></div>
            
            <input type="number" id="reg-leeftijd" placeholder="Leeftijd" required min="1">
            <div id="reg-leeftijd-error" class="error"></div>

            <input type="text" id="reg-club" placeholder="Welke club speel je voor?" required>
            <div id="reg-club-error" class="error"></div>

            <button onclick="register()">Registreren</button>
            <p class="toggle-auth" onclick="toggleAuth()">Heb je al een account? Log hier in.</p>
        </div>
    </div>

    <!-- HOME SCHERM (Pas zichtbaar na inloggen) -->
    <div class="hidden" id="lists-section" style="max-width: 800px; margin: 0 auto;">
        
        <div class="home-header">
            <h2 id="welkom-bericht">Welkom!</h2>
            <button onclick="logout()" style="width: auto; padding: 10px 20px; margin: 0;">Uitloggen</button>
        </div>

        <div class="lists-container">
            <div class="list-box">
                <h2>✅ Goedgekeurde Uitdagers</h2>
                <ul id="goedgekeurd">
                    <!-- Wordt live ingeladen via Firestore -->
                </ul>
            </div>

            <div class="list-box">
                <h2>⏳ Wachtlijst Uitdagers</h2>
                <ul id="wachtlijst">
                    <!-- Wordt live ingeladen via Firestore -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- 1. JOUW NIEUWE FIRESTORE CONFIGURATIE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCAS2kcDMo0ELhbrLPk3VcNVoAjD7J7dN8",
            authDomain: "penaltykingbattles.firebaseapp.com",
            projectId: "penaltykingbattles",
            storageBucket: "penaltykingbattles.firebasestorage.app",
            messagingSenderId: "148552649157",
            appId: "1:148552649157:web:4c66daf565f70499dc63ac",
            measurementId: "G-DFF11NL0RW"
        };

        // Initialiseer Firebase en Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let firestoreListener = null; // Variabele om de live listener op te slaan

        // --- 2. HULPFUNCTIES ---
        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            clearErrors();
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(e => e.innerText = '');
        }

        function isValidText(text) {
            const regex = /^[a-zA-Z0-9\s]+$/;
            return regex.test(text);
        }

        // --- 3. REGISTREREN ---
        async function register() {
            clearErrors();
            const naam = document.getElementById('reg-naam').value.trim();
            const leeftijd = document.getElementById('reg-leeftijd').value;
            const club = document.getElementById('reg-club').value.trim();

            let hasError = false;

            if (!naam || !isValidText(naam)) {
                document.getElementById('reg-naam-error').innerText = 'Ongeldige naam. Gebruik alleen letters.';
                hasError = true;
            }
            if (!leeftijd) {
                document.getElementById('reg-leeftijd-error').innerText = 'Leeftijd is verplicht.';
                hasError = true;
            }
            if (!club || !isValidText(club)) {
                document.getElementById('reg-club-error').innerText = 'Ongeldige clubnaam. Gebruik alleen letters en cijfers.';
                hasError = true;
            }

            if (hasError) return;

            // Check in FIRESTORE of de naam al bestaat
            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('naam', '==', naam).get();
            
            if (!snapshot.empty) {
                document.getElementById('reg-naam-error').innerText = 'Deze naam bestaat al. Probeer in te loggen.';
                return;
            }

            // Gebruiker opslaan in Firestore
            await usersRef.add({
                naam: naam, 
                leeftijd: parseInt(leeftijd),
                club: club,
                status: 'wachtlijst' // Standaard op de wachtlijst
            });

            alert('Registratie succesvol! Je bent nu ingelogd.');
            showListsSection(naam); 
        }

        // --- 4. INLOGGEN ---
        async function login() {
            clearErrors();
            const naam = document.getElementById('login-naam').value.trim();

            if (!naam) {
                document.getElementById('login-error').innerText = 'Vul je naam in.';
                return;
            }

            // Zoeken in FIRESTORE naar deze naam
            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('naam', '==', naam).get();
            
            if (!snapshot.empty) {
                let exactMatch = false;
                
                snapshot.forEach(doc => {
                    if (doc.data().naam === naam) {
                        exactMatch = true;
                    }
                });

                if (exactMatch) {
                    showListsSection(naam); 
                } else {
                    document.getElementById('login-error').innerText = 'Fout: Let goed op de hoofdletters en kleine letters in je naam!';
                }
            } else {
                document.getElementById('login-error').innerText = 'Naam niet gevonden. Check je spelling of registreer een account.';
            }
        }

        function logout() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('lists-section').classList.add('hidden');
            document.getElementById('login-naam').value = '';
            
            // Stop met live luisteren als de gebruiker uitlogt
            if (firestoreListener) {
                firestoreListener();
            }
        }

        // --- 5. HOME SCHERM & LIJSTEN LADEN (FIRESTORE LIVE UPDATES) ---
        function showListsSection(ingelogdeNaam) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('lists-section').classList.remove('hidden');
            
            // Voornaam eruit halen voor welkomstbericht
            const voornaamIngelogd = ingelogdeNaam.split(' ')[0];
            document.getElementById('welkom-bericht').innerText = `Welkom, ${voornaamIngelogd}!`;
            
            const wachtlijstUI = document.getElementById('wachtlijst');
            const goedgekeurdUI = document.getElementById('goedgekeurd');

            // Luister live naar FIRESTORE (onSnapshot)
            firestoreListener = db.collection('users').onSnapshot((querySnapshot) => {
                wachtlijstUI.innerHTML = '';
                goedgekeurdUI.innerHTML = '';

                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    const li = document.createElement('li');
                    
                    // KNIP DE ACHTERNAAM ERAF (pakt alleen het eerste woord van de naam)
                    const voornaamLijst = user.naam.split(' ')[0];
                    
                    li.innerText = `👤 ${voornaamLijst} (${user.leeftijd} jr) - ⚽ ${user.club}`;

                    if (user.status === 'wachtlijst') {
                        wachtlijstUI.appendChild(li);
                    } else if (user.status === 'goedgekeurd') {
                        goedgekeurdUI.appendChild(li);
                    }
                });
            });
        }
    </script>
</body>
</html>
