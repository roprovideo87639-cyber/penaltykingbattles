<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty King Battles</title>
    <!-- Logo in de browser tab -->
    <link rel="icon" href="logo.png" type="image/x-icon">
    
    <!-- Firebase SDK (Compat versie voor makkelijke integratie in 1 bestand) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            /* De blauw en geel kleuren */
            --blue: #0033A0;
            --yellow: #FFD100;
        }
        body {
            background-color: var(--blue);
            color: var(--yellow);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-bottom: 30px;
        }
        .title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .title-container img {
            height: 60px;
            width: auto;
            border-radius: 5px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        h3 {
            margin: 5px 0 20px 0;
            font-style: italic;
            color: #fff;
        }
        .container {
            background-color: #fff;
            color: var(--blue);
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--blue);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            background-color: var(--blue);
            color: var(--yellow);
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            transition: 0.3s;
        }
        button:hover {
            background-color: #001F60;
        }
        .lists-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .list-box {
            background-color: var(--yellow);
            color: var(--blue);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .list-box h2 {
            border-bottom: 2px solid var(--blue);
            padding-bottom: 10px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: rgba(255, 255, 255, 0.6);
            margin: 8px 0;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .hidden {
            display: none !important;
        }
        .toggle-auth {
            text-align: center;
            cursor: pointer;
            color: var(--blue);
            text-decoration: underline;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-container">
            <!-- Het logo aan de linkerkant van de titel (zorg dat logo.png in dezelfde map staat) -->
            <img src="logo.png" alt="Logo" id="logo" onerror="this.style.display='none'">
            <h1>Penalty King Battles</h1>
        </div>
        <h3>discription: 2026/27 Golden Season</h3>
    </header>

    <!-- INLOGGEN EN REGISTREREN -->
    <div class="container" id="auth-section">
        
        <!-- Inlog Formulier -->
        <div id="login-form">
            <h2>Inloggen</h2>
            <input type="text" id="login-naam" placeholder="Jouw exacte Naam (Let op hoofdletters!)" required>
            <div id="login-error" class="error"></div>
            <button onclick="login()">Inloggen</button>
            <p class="toggle-auth" onclick="toggleAuth()">Nog geen account? Registreer hier.</p>
        </div>

        <!-- Registratie Formulier -->
        <div id="register-form" class="hidden">
            <h2>Registreren</h2>
            <!-- Regex pattern in javascript voorkomt leestekens -->
            <input type="text" id="reg-naam" placeholder="Naam (geen tekens zoals !@#$)" required>
            <div id="reg-naam-error" class="error"></div>
            
            <input type="number" id="reg-leeftijd" placeholder="Leeftijd" required min="1">
            <div id="reg-leeftijd-error" class="error"></div>

            <input type="text" id="reg-club" placeholder="Welke club speel je voor? (geen tekens zoals !@#$)" required>
            <div id="reg-club-error" class="error"></div>

            <button onclick="register()">Registreren</button>
            <p class="toggle-auth" onclick="toggleAuth()">Heb je al een account? Log hier in.</p>
        </div>
    </div>

    <!-- LIJSTEN (Pas zichtbaar na inloggen) -->
    <div class="container hidden" id="lists-section" style="background-color: transparent; padding: 0; box-shadow: none;">
        <button onclick="logout()" style="width: auto; padding: 10px 20px; float: right; margin-bottom: 20px;">Uitloggen</button>
        <div style="clear: both;"></div>

        <div class="lists-container">
            <div class="list-box">
                <h2>Wachtlijst Uitdagers</h2>
                <ul id="wachtlijst">
                    <!-- Wordt live ingeladen via Firebase -->
                </ul>
            </div>

            <div class="list-box">
                <h2>Goedgekeurde Uitdagers</h2>
                <ul id="goedgekeurd">
                    <!-- Wordt live ingeladen via Firebase -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- 1. JOUW FIREBASE CONFIGURATIE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAW-X3XYChG5AFwsXg8WNeL9wiMkonVaoc",
            authDomain: "b-street-cup.firebaseapp.com",
            databaseURL: "https://b-street-cup-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "b-street-cup",
            storageBucket: "b-street-cup.firebasestorage.app",
            messagingSenderId: "476783560837",
            appId: "1:476783560837:web:3b6c0a37c0f8d201a441ec",
            measurementId: "G-K5E1TET81Z"
        };

        // Initialiseer Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. HULPFUNCTIES ---
        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            clearErrors();
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(e => e.innerText = '');
        }

        function isValidText(text) {
            // Controleert of er geen speciale tekens inzitten (alleen letters, cijfers en spaties toegestaan)
            const regex = /^[a-zA-Z0-9\s]+$/;
            return regex.test(text);
        }

        // --- 3. REGISTREREN ---
        async function register() {
            clearErrors();
            const naam = document.getElementById('reg-naam').value.trim();
            const leeftijd = document.getElementById('reg-leeftijd').value;
            const club = document.getElementById('reg-club').value.trim();

            let hasError = false;

            if (!naam || !isValidText(naam)) {
                document.getElementById('reg-naam-error').innerText = 'Ongeldige naam. Gebruik geen tekens zoals !@#$.';
                hasError = true;
            }
            if (!leeftijd) {
                document.getElementById('reg-leeftijd-error').innerText = 'Leeftijd is verplicht.';
                hasError = true;
            }
            if (!club || !isValidText(club)) {
                document.getElementById('reg-club-error').innerText = 'Ongeldige clubnaam. Gebruik geen tekens zoals !@#$.';
                hasError = true;
            }

            if (hasError) return;

            // Check of de naam toevallig al bestaat
            const snapshot = await db.ref('users').orderByChild('naam').equalTo(naam).once('value');
            if (snapshot.exists()) {
                document.getElementById('reg-naam-error').innerText = 'Deze naam bestaat al. Probeer in te loggen.';
                return;
            }

            // Gebruiker toevoegen in Firebase (status = wachtlijst)
            const newUserRef = db.ref('users').push();
            await newUserRef.set({
                naam: naam,
                leeftijd: parseInt(leeftijd),
                club: club,
                status: 'wachtlijst' 
            });

            alert('Registratie succesvol! Je bent nu ingelogd.');
            showListsSection();
        }

        // --- 4. INLOGGEN ---
        async function login() {
            clearErrors();
            const naam = document.getElementById('login-naam').value.trim();

            if (!naam) {
                document.getElementById('login-error').innerText = 'Vul je naam in.';
                return;
            }

            // Zoeken in Firebase naar deze naam
            const snapshot = await db.ref('users').orderByChild('naam').equalTo(naam).once('value');
            
            if (snapshot.exists()) {
                let exactMatch = false;
                
                // Dubbele controle of de hoofdletters EXACT kloppen
                snapshot.forEach(child => {
                    if (child.val().naam === naam) {
                        exactMatch = true;
                    }
                });

                if (exactMatch) {
                    showListsSection();
                } else {
                    document.getElementById('login-error').innerText = 'Fout: Let goed op de hoofdletters en kleine letters in je naam!';
                }
            } else {
                document.getElementById('login-error').innerText = 'Naam niet gevonden. Check je spelling of registreer een account.';
            }
        }

        function logout() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('lists-section').classList.add('hidden');
            document.getElementById('login-naam').value = '';
        }

        // --- 5. LIJSTEN LADEN (LIVE VIA FIREBASE) ---
        function showListsSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('lists-section').classList.remove('hidden');
            
            const wachtlijstUI = document.getElementById('wachtlijst');
            const goedgekeurdUI = document.getElementById('goedgekeurd');

            // .on('value') zorgt ervoor dat de lijst LIVE wordt geüpdatet zonder te refreshen
            db.ref('users').on('value', (snapshot) => {
                wachtlijstUI.innerHTML = '';
                goedgekeurdUI.innerHTML = '';

                snapshot.forEach((childSnapshot) => {
                    const user = childSnapshot.val();
                    const li = document.createElement('li');
                    
                    // Weergeven: Naam (Leeftijd) - Club
                    li.innerText = `${user.naam} (${user.leeftijd} jr) - ${user.club}`;

                    if (user.status === 'wachtlijst') {
                        wachtlijstUI.appendChild(li);
                    } else if (user.status === 'goedgekeurd') {
                        goedgekeurdUI.appendChild(li);
                    }
                });
            });
        }
    </script>
</body>
</html>
