<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty King Battles</title>
    <!-- Logo in de browser tab -->
    <link rel="icon" href="logo.png" type="image/x-icon">
    
    <!-- Google Fonts voor een modernere look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Firestore versie voor 1 bestand) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --blue: #0033A0;
            --blue-dark: #002270;
            --yellow: #FFD100;
            --yellow-light: #ffea79;
            --white: #FFFFFF;
            --gray-bg: #f4f6fc;
        }

        body {
            background-color: var(--blue);
            color: var(--white);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 20px 0 30px 0;
            text-align: center;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .title-container img {
            height: 75px;
            width: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: var(--white);
            padding: 4px;
        }

        h1 {
            margin: 0;
            font-size: 2.8em;
            font-weight: 800;
            color: var(--yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h3 {
            margin: 8px 0 0 0;
            font-size: 1.1em;
            font-weight: 600;
            color: var(--yellow-light);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--white);
            color: var(--blue);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .card h2 {
            margin-top: 0;
            font-weight: 700;
            color: var(--blue);
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--yellow);
            padding-bottom: 8px;
            display: inline-block;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0 16px 0;
            border: 2px solid #e1e6ed;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background-color: var(--gray-bg);
        }

        input:focus {
            border-color: var(--blue);
            background-color: var(--white);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,51,160,0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background-color: var(--yellow);
            color: var(--blue);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255,209,0,0.3);
        }

        button:hover {
            background-color: #e5bc00;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,209,0,0.4);
        }

        .btn-secondary {
            background-color: var(--blue);
            color: var(--yellow);
            box-shadow: 0 4px 12px rgba(0,51,160,0.3);
        }

        .btn-secondary:hover {
            background-color: var(--blue-dark);
            color: var(--yellow);
        }

        /* Home Scherm & Lijsten */
        .dashboard-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            color: var(--blue);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        .home-header h2 {
            margin: 0;
            font-size: 1.6em;
            font-weight: 700;
        }

        .lists-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media(max-width: 768px) {
            .lists-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2em;
            }
        }

        .list-box {
            background-color: var(--yellow);
            color: var(--blue);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .list-box h2 {
            margin-top: 0;
            font-size: 1.4em;
            border-bottom: 2px solid var(--blue);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        li {
            background-color: rgba(255, 255, 255, 0.85);
            margin: 10px 0;
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.05em;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        li:hover {
            transform: scale(1.01);
            background-color: var(--white);
        }

        .player-name {
            font-size: 1.15em;
            color: var(--blue-dark);
            font-weight: 700;
        }

        .player-info {
            font-size: 0.85em;
            color: #555;
            font-weight: 500;
        }

        .error {
            color: #d93838;
            font-size: 0.85em;
            font-weight: 600;
            margin: -10px 0 10px 0;
        }

        .hidden {
            display: none !important;
        }

        .toggle-auth {
            text-align: center;
            cursor: pointer;
            color: var(--blue);
            font-weight: 600;
            text-decoration: underline;
            margin-top: 20px;
            font-size: 0.95em;
        }

        .toggle-auth:hover {
            color: var(--blue-dark);
        }
    </style>
</head>
<body>

    <header>
        <div class="title-container">
            <img src="logo.png" alt="Logo" id="logo" onerror="this.style.display='none'">
            <h1>Penalty King Battles</h1>
        </div>
        <h3>Golden Season 2026/27</h3>
    </header>

    <!-- INLOGGEN EN REGISTREREN (CARD) -->
    <div class="card" id="auth-section">
        
        <!-- Inlog Formulier -->
        <div id="login-form">
            <h2>Inloggen</h2>
            <label style="font-weight: 600; font-size: 0.9em; color: #555;">Jouw exacte volledige naam</label>
            <input type="text" id="login-naam" placeholder="Bijv. Jan Smit" required>
            <div id="login-error" class="error"></div>
            <button onclick="login()">Inloggen</button>
            <p class="toggle-auth" onclick="toggleAuth()">Nog geen account? Registreer hier.</p>
        </div>

        <!-- Registratie Formulier -->
        <div id="register-form" class="hidden">
            <h2>Registreren</h2>
            
            <label style="font-weight: 600; font-size: 0.9em; color: #555;">Volledige naam</label>
            <input type="text" id="reg-naam" placeholder="Bijv. Jan Smit" required>
            <div id="reg-naam-error" class="error"></div>
            
            <label style="font-weight: 600; font-size: 0.9em; color: #555;">Leeftijd</label>
            <input type="number" id="reg-leeftijd" placeholder="Bijv. 18" required min="1">
            <div id="reg-leeftijd-error" class="error"></div>

            <label style="font-weight: 600; font-size: 0.9em; color: #555;">Voetbalclub</label>
            <input type="text" id="reg-club" placeholder="Bijv. FC Ajax" required>
            <div id="reg-club-error" class="error"></div>

            <button onclick="register()">Account Aanmaken</button>
            <p class="toggle-auth" onclick="toggleAuth()">Heb je al een account? Log hier in.</p>
        </div>
    </div>

    <!-- HOME SCHERM (Lijsten na inloggen) -->
    <div class="hidden dashboard-container" id="lists-section">
        
        <div class="home-header">
            <h2 id="welkom-bericht">Welkom!</h2>
            <button class="btn-secondary" onclick="logout()" style="width: auto; padding: 10px 24px; margin: 0;">Uitloggen</button>
        </div>

        <div class="lists-grid">
            <!-- Categorie 1: Goedgekeurd -->
            <div class="list-box">
                <h2>✅ Goedgekeurde Uitdagers</h2>
                <ul id="goedgekeurd">
                    <!-- Live ingeladen via Firestore -->
                </ul>
            </div>

            <!-- Categorie 2: Wachtlijst -->
            <div class="list-box">
                <h2>⏳ Wachtlijst Uitdagers</h2>
                <ul id="wachtlijst">
                    <!-- Live ingeladen via Firestore -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- 1. JOUW FIRESTORE CONFIGURATIE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCAS2kcDMo0ELhbrLPk3VcNVoAjD7J7dN8",
            authDomain: "penaltykingbattles.firebaseapp.com",
            projectId: "penaltykingbattles",
            storageBucket: "penaltykingbattles.firebasestorage.app",
            messagingSenderId: "148552649157",
            appId: "1:148552649157:web:4c66daf565f70499dc63ac",
            measurementId: "G-DFF11NL0RW"
        };

        // Initialiseer Firebase en Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let firestoreListener = null;

        // --- 2. HULPFUNCTIES ---
        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            clearErrors();
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(e => e.innerText = '');
        }

        function isValidText(text) {
            const regex = /^[a-zA-Z0-9\s]+$/;
            return regex.test(text);
        }

        // --- 3. REGISTREREN ---
        async function register() {
            clearErrors();
            const naam = document.getElementById('reg-naam').value.trim();
            const leeftijd = document.getElementById('reg-leeftijd').value;
            const club = document.getElementById('reg-club').value.trim();

            let hasError = false;

            if (!naam || !isValidText(naam)) {
                document.getElementById('reg-naam-error').innerText = 'Ongeldige naam. Gebruik alleen letters.';
                hasError = true;
            }
            if (!leeftijd) {
                document.getElementById('reg-leeftijd-error').innerText = 'Leeftijd is verplicht.';
                hasError = true;
            }
            if (!club || !isValidText(club)) {
                document.getElementById('reg-club-error').innerText = 'Ongeldige clubnaam. Gebruik geen speciale tekens.';
                hasError = true;
            }

            if (hasError) return;

            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('naam', '==', naam).get();
            
            if (!snapshot.empty) {
                document.getElementById('reg-naam-error').innerText = 'Deze naam bestaat al. Probeer in te loggen.';
                return;
            }

            await usersRef.add({
                naam: naam, 
                leeftijd: parseInt(leeftijd),
                club: club,
                status: 'wachtlijst'
            });

            alert('Registratie succesvol! Je bent nu ingelogd.');
            showListsSection(naam); 
        }

        // --- 4. INLOGGEN ---
        async function login() {
            clearErrors();
            const naam = document.getElementById('login-naam').value.trim();

            if (!naam) {
                document.getElementById('login-error').innerText = 'Vul je naam in.';
                return;
            }

            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('naam', '==', naam).get();
            
            if (!snapshot.empty) {
                let exactMatch = false;
                
                snapshot.forEach(doc => {
                    if (doc.data().naam === naam) {
                        exactMatch = true;
                    }
                });

                if (exactMatch) {
                    showListsSection(naam); 
                } else {
                    document.getElementById('login-error').innerText = 'Fout: Let goed op de hoofdletters en kleine letters in je naam!';
                }
            } else {
                document.getElementById('login-error').innerText = 'Naam niet gevonden. Check je spelling of registreer een account.';
            }
        }

        function logout() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('lists-section').classList.add('hidden');
            document.getElementById('login-naam').value = '';
            
            if (firestoreListener) {
                firestoreListener();
            }
        }

        // --- 5. HOME SCHERM & LIJSTEN LADEN (FIRESTORE LIVE) ---
        function showListsSection(ingelogdeNaam) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('lists-section').classList.remove('hidden');
            
            const voornaamIngelogd = ingelogdeNaam.split(' ')[0];
            document.getElementById('welkom-bericht').innerText = `Welkom, ${voornaamIngelogd}! 👑`;
            
            const wachtlijstUI = document.getElementById('wachtlijst');
            const goedgekeurdUI = document.getElementById('goedgekeurd');

            firestoreListener = db.collection('users').onSnapshot((querySnapshot) => {
                wachtlijstUI.innerHTML = '';
                goedgekeurdUI.innerHTML = '';

                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    const li = document.createElement('li');
                    
                    // Alleen voornaam tonen in de lijst
                    const voornaamLijst = user.naam.split(' ')[0];
                    
                    li.innerHTML = `
                        <span class="player-name">${voornaamLijst}</span>
                        <span class="player-info">Leeftijd: ${user.leeftijd} jr | Club: ${user.club}</span>
                    `;

                    if (user.status === 'wachtlijst') {
                        wachtlijstUI.appendChild(li);
                    } else if (user.status === 'goedgekeurd') {
                        goedgekeurdUI.appendChild(li);
                    }
                });
            });
        }
    </script>
</body>
</html>
